name: Build Stardew Agent demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cli:
    name: Build CLI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            binary_suffix: ".exe"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run CLI tests
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Build CLI binaries
        run: cargo build --manifest-path cli/Cargo.toml --release

      - name: Stage CLI artifact
        shell: bash
        run: |
          mkdir -p artifact/release
          cp "cli/target/release/stardew-cli${{ matrix.binary_suffix }}" artifact/release/
          cp "cli/target/release/fake-mod${{ matrix.binary_suffix }}" artifact/release/

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: stardew-agent-cli-${{ matrix.name }}-${{ github.run_number }}
          path: artifact/

  build-smapi-mod:
    name: Build SMAPI Mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up SMAPI mod build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Mod and release zip
        run: dotnet build smapi-mod/StardewAgentMod.csproj --configuration Release

      - name: Upload Mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: stardew-agent-mod-${{ github.run_number }}
          path: _releases/*.zip
          if-no-files-found: error
