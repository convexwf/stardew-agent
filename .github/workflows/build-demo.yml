name: Build Stardew Agent demo

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cli:
    name: Build CLI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            binary_suffix: ".exe"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run CLI tests
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Build CLI binaries
        run: cargo build --manifest-path cli/Cargo.toml --release

      - name: Stage CLI artifact
        shell: bash
        run: |
          mkdir -p artifact/release
          cp "cli/target/release/stardew-cli${{ matrix.binary_suffix }}" artifact/release/
          cp "cli/target/release/fake-mod${{ matrix.binary_suffix }}" artifact/release/

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: stardew-agent-cli-${{ matrix.name }}-${{ github.run_number }}
          path: artifact/
          retention-days: 3

  build-smapi-mod:
    name: Build SMAPI Mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up SMAPI mod build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Mod and release zip
        run: dotnet build smapi-mod/StardewAgentMod.csproj --configuration Release

      - name: Upload Mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: stardew-agent-mod-${{ github.run_number }}
          path: _releases/*.zip
          if-no-files-found: error
          retention-days: 3

  release-latest:
    name: Update latest GitHub Release
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    needs:
      - build-cli
      - build-smapi-mod
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: stardew-agent-latest-release
      cancel-in-progress: false
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets release-package mod-unpacked

          mod_zip="$(find artifacts -type f -name '*.zip' -print -quit)"
          test -n "$mod_zip"
          unzip -q "$mod_zip" -d mod-unpacked
          manifest="$(find mod-unpacked -type f -name 'manifest.json' -print -quit)"
          test -n "$manifest"
          mod_root="$(dirname "$manifest")"
          cp -R "$mod_root"/. release-package/

          cli="$(find artifacts -type f -name 'stardew-cli.exe' -print -quit)"
          fake_mod="$(find artifacts -type f -name 'fake-mod.exe' -print -quit)"
          test -n "$cli"
          test -n "$fake_mod"
          cp "$cli" release-package/stardew-cli.exe
          cp "$fake_mod" release-package/fake-mod.exe
          (cd release-package && zip -qr ../release-assets/stardew-agent-windows.zip .)

          ls -la release-assets

      - name: Create or update latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Demo
          body: |
            自动构建的 Stardew Agent Demo 产物。

            构建提交：${{ github.sha }}
            构建时间：${{ github.event.head_commit.timestamp || github.run_started_at }}
          prerelease: true
          overwrite_files: true
          files: |
            release-assets/stardew-agent-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
